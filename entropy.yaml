# Demo config: matches examples/compose.yaml (Redis behind Toxiproxy).
# For the chaos-engineering lab, see examples/entropy.lab.yaml.

environment:
  name: local

# In my case, Podman on Windows publishes container ports on the VM's address, not localhost.
# Use localhost instead if your container runtime publishes there (e.g. Docker Desktop).
toxiproxy:
  api: http://172.28.142.159:8474

dependencies:
  - name: redis
    kind: redis
    address: 172.28.142.159:6379   # services connect here (through the proxy)
    upstream: redis:6379      # the real Redis, as Toxiproxy sees it

services:
  # Replace your-service-name with your own service. Until something answers on this URL it shows as Unreachable.
  - name: your-service-name
    baseUrl: http://127.0.0.1:8080/your-service-name/b2b
    uses: [redis]
    healthCommand: your-service-name
    # Commands you can run from the service's page (or `entropy run your-service-name/<name>`).
    # Exit code 0 = success. They also get ENTROPY_BASE_URL and ENTROPY_SERVICE.
    # Replace D:path/to/bruno-collection, path/to/command.yml, your environment, and your sandbox(ex: developer) with your own config.
    #
    commands:
      - name: your-service-name
        run: bru run "path/to/command.yml" --env "your environment" --sandbox="your sandbox(ex: developer)"
        cwd: D:path/to/bruno-collection   # default: this file's folder
        timeoutSec: 30                          # default 30, max 600

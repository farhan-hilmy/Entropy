services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
  
  backend:
    build: .
    environment:
      - TOXIPROXY_URL=http://toxiproxy:8474
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - toxiproxy

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.11.0
    ports:
      - "8474:8474"
